version: 1
project:
  name: bedrock-replay-stability
  description: Deterministic offline NL-to-SQL stability replay with an explicitly separate live recording lane
  type: application

execution:
  default_context: host
  backends:
    container:
      image: python@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280
      engines: [docker]
  contexts:
    host:
      backend: native
    replay:container:
      backend: container
      lifecycle: ephemeral
      container:
        image: python@sha256:eb43ff125d8d58d7449dcba7d336c23bcac412f526d861db493b9994d8010280

toolchains:
  python:
    version: ">=3.10,<3.14"

env:
  vars:
    ANTHROPIC_API_KEY:
      secret: true
    ANTHROPIC_MODEL:
      default: claude-sonnet-4-6
    BEDROCK_MAX_RETRIES:
      default: "3"
    BEDROCK_MAX_ROWS:
      default: "1000"
    BEDROCK_QUERY_TIMEOUT_S:
      default: "5.0"
    BEDROCK_DB:
      default: data/store.db
    BEDROCK_GOLD:
      default: data/gold.json
    BEDROCK_FIXTURE:
      default: data/fixture.jsonl
    BEDROCK_BASELINE:
      default: data/baseline.json
    BEDROCK_K:
      default: "5"
    BEDROCK_FLOAT_TOL:
      default: "2"
    BEDROCK_MAX_DROP:
      default: "0.05"

checks:
  - name: committed-sql-fixture
    kind: file
    severity: error
    path: data/fixture.jsonl
    expect: file
  - name: frozen-sqlite-store
    kind: file
    severity: error
    path: data/store.db
    expect: file
  - name: defended-baseline
    kind: file
    severity: error
    path: data/baseline.json
    expect: file

tasks:
  test:equivalence:
    description: Verify deterministic result-set canonicalization
    category: test
    internal: true
    command:
      exe: python
      args:
        - -B
        - tests/test_equivalence.py
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - tests/test_equivalence.py
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - tests/test_equivalence.py
    requirements:
      toolchains:
        - python
    safe_for_agent: true

  test:harness:
    description: Verify K-run stability scoring and flapping detection
    category: test
    internal: true
    command:
      exe: python
      args:
        - -B
        - tests/test_harness.py
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - tests/test_harness.py
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - tests/test_harness.py
    requirements:
      toolchains:
        - python
    safe_for_agent: true

  test:gate:
    description: Verify the stability regression gate
    category: test
    internal: true
    command:
      exe: python
      args:
        - -B
        - tests/test_gate.py
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - tests/test_gate.py
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - tests/test_gate.py
    requirements:
      toolchains:
        - python
    safe_for_agent: true

  test:hardening:
    description: Verify fixture coverage and malformed-run failure behavior
    category: test
    internal: true
    command:
      exe: python
      args:
        - -B
        - tests/test_hardening.py
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - tests/test_hardening.py
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - tests/test_hardening.py
    requirements:
      toolchains:
        - python
    safe_for_agent: true

  test:
    description: Run the deterministic no-key verification surface
    category: test
    aggregate:
      tasks:
        - test:equivalence
        - test:harness
        - test:gate
        - test:hardening
    safe_for_agent: true

  report:
    description: Replay the committed SQL fixture against the frozen SQLite store and print the K-run scorecard
    category: verify
    replay_inputs:
      - id: recorded_sql
        kind: static_file
        path: data/fixture.jsonl
        expected_identity: sha256:de860b6f54303a4bed43a3d4cab39cd2d44c8d4eb65593bc0914b7ff0fadd245
      - id: frozen_store
        kind: static_file
        path: data/store.db
        expected_identity: sha256:e058b68852e773b0b86f869b161ff29886c900bb23cd3af67ae93a96331fb0b6
      - id: equivalence
        kind: comparator_profile
        path: app/equivalence.py
        expected_identity: sha256:08b15edb2b5b9a66520f172c696846f4181f63d43f56477f01c4cfce4f61abef
    witnessed_observations:
      query_traces:
        - id: recorded_sql
          path: data/fixture.jsonl
    command:
      exe: python
      args:
        - -B
        - main.py
        - report
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - main.py
            - report
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - main.py
            - report
    requirements:
      toolchains:
        - python
    safe_for_agent: true
    execution:
      modes:
        container:
          context: replay:container
    notes: |
      This is an offline replay of recorded SQL against committed fixture and store inputs. It
      does not prove live-model generation or live external-state behavior.

  gate:
    description: Compare the committed replay candidate against the defended stability baseline
    category: verify
    replay_inputs:
      - id: recorded_sql
        kind: static_file
        path: data/fixture.jsonl
        expected_identity: sha256:de860b6f54303a4bed43a3d4cab39cd2d44c8d4eb65593bc0914b7ff0fadd245
      - id: frozen_store
        kind: static_file
        path: data/store.db
        expected_identity: sha256:e058b68852e773b0b86f869b161ff29886c900bb23cd3af67ae93a96331fb0b6
      - id: equivalence
        kind: comparator_profile
        path: app/equivalence.py
        expected_identity: sha256:08b15edb2b5b9a66520f172c696846f4181f63d43f56477f01c4cfce4f61abef
      - id: defended_baseline
        kind: static_file
        path: data/baseline.json
        expected_identity: sha256:18db24e2ebc20c0b781942eb515dc9a466d6d36f09bf5e763e3e8998b36aa2c8
    witnessed_observations:
      query_traces:
        - id: recorded_sql
          path: data/fixture.jsonl
    command:
      exe: python
      args:
        - -B
        - main.py
        - gate
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - -B
            - main.py
            - gate
      - when:
          os: macos
        command:
          exe: python3
          args:
            - -B
            - main.py
            - gate
    requirements:
      toolchains:
        - python
    safe_for_agent: true
    execution:
      modes:
        container:
          context: replay:container
    notes: |
      This gate proves the recorded candidate does not regress against the committed baseline.
      It does not prove that a live model or live database will reproduce the same result.

  record:live:
    description: Record fresh SQL from the live Claude-backed agent for a later replay fixture
    category: verify
    command:
      exe: python
      args:
        - main.py
        - record
    variants:
      - when:
          os: linux
        command:
          exe: python3
          args:
            - main.py
            - record
      - when:
          os: macos
        command:
          exe: python3
          args:
            - main.py
            - record
    requirements:
      toolchains:
        - python
      env:
        - ANTHROPIC_API_KEY
    effects:
      writes:
        - data/fixture.jsonl
      network: true
      network_kind: integration_test
      external_state:
        - anthropic_api
    notes: |
      This is intentionally outside the deterministic pressure proof. It reaches a live model,
      rewrites the recorded SQL fixture, and depends on a generic unpinned pip requirements path
      that Ota does not yet own through typed dependency hydration.

workflows:
  default: verify
  verify:
    intent: ci_validation
    description: Replay the committed SQL fixture and block stability regressions against the defended baseline
    run:
      task: gate
    proof:
      claim: bounded
    notes: |
      This is the deterministic offline verification lane. It proves the declared fixture, store,
      and baseline inputs only; live model generation remains intentionally outside this workflow.
      Its proof-breadth claim remains unknown until Ota archives a matching execution-authored proof.

agent:
  posture: readiness_strict
  entrypoint: test
  default_task: test
  safe_tasks:
    - test
    - report
    - gate
  protected_paths:
    - .github/workflows
    - data/baseline.json
    - data/fixture.jsonl
    - data/store.db
  bootstrap:
    ota:
      note: Only install ota if it is missing and installation is approved.
      source:
        kind: branch
        branch: 1.6.25-implementation
