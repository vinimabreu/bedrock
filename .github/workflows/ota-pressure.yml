name: Ota Pressure

on:
  push:
    branches:
      - bobai/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-replay:
    name: Deterministic replay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: ota-run/setup@v1
        with:
          source: contract
          contract-path: ota.yaml

      - name: Validate contract
        run: ota validate .

      - name: Diagnose readiness
        run: ota doctor

      - name: List runnable tasks
        run: ota tasks --use

      - name: List agent-safe tasks
        run: ota tasks --safe --use

      - name: Preview deterministic replay surface
        run: ota run gate --agent --dry-run

      - name: Preview deterministic replay workflow
        run: ota up --workflow verify --agent --dry-run

      - name: Prepare deterministic replay workflow
        run: ota up --workflow verify --agent

      - name: Run deterministic tests
        run: ota run test --agent

      - name: Replay the recorded SQL scorecard
        run: ota run report --agent

      - name: Evaluate the stability gate
        run: ota run gate --agent

      - name: Archive workflow receipt
        run: ota receipt --workflow verify --json --archive .
